<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RISE StudyBank - CSEC GUYANA</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f8fafc;color:#0f172a}.top{background:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e2e8f0;position:sticky;top:0}.logo{display:flex;align-items:center;gap:10px}.pill{background:#1e3a8a;color:#fff;padding:10px 18px;border-radius:999px;font-weight:800;text-decoration:none}.card{background:#fff;border-radius:20px;padding:20px;margin:14px;box-shadow:0 4px 18px rgba(0,0,0,.06)}h1{font-size:28px}.blue{color:#1e40af}.btn{width:100%;border:0;border-radius:999px;padding:16px;font-weight:800;cursor:pointer}.btn-blue{background:#1e3a8a;color:#fff}.input{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:12px;margin:8px 0;font-size:16px}.hidden{display:none}.small{font-size:13px;color:#64748b}</style>
</head>
<body>
<div class="top"><div class="logo"><img src="logo.png" style="width:52px;height:52px;object-fit:contain"><div><b>RISE StudyBank</b><div style="font-size:11px;color:#64748b">CSEC • GUYANA</div></div></div><a class="pill" href="#join">Join - $2000</a></div>
<div id="view-join"><div class="card"><div class="small">Live: <span id="liveStatus">ready</span></div><h1>Unlock All Subjects.<br><span class="blue">Study Smarter.</span></h1><p class="small">After submit, WhatsApp to 592-766-4692 auto-opens — admin sees you instantly.</p><button class="btn btn-blue" onclick="document.getElementById('joinForm').scrollIntoView({behavior:'smooth'})">Join RISE StudyBank</button></div>
<div id="joinForm" class="card"><h3>Join - FIXED</h3><input id="name" class="input" placeholder="Full Name"><input id="wa" class="input" placeholder="WhatsApp Number"><input id="txn" class="input" placeholder="MMG Transaction ID"><button class="btn btn-blue" onclick="doJoin()">Submit & Send to WhatsApp</button><p id="joinMsg" class="small" style="color:red"></p></div></div>
<div id="view-pending" class="hidden"><div class="card" style="background:#1e3a8a;color:#fff"><h2>✅ Request Sent!</h2><p>Hi <b id="pName"></b>, ID <b id="pId"></b> pending.</p><p><a id="waLink" style="color:#93c5fd" target="_blank">Open WhatsApp to 592-766-4692 again</a></p><p class="small" style="color:#bfdbfe">Txn: <span id="pTxn"></span> | <span id="pStatus">pending</span></p><button class="btn" style="background:#fff;color:#1e3a8a" onclick="checkStatus()">Check Approval</button><button class="btn" style="background:transparent;color:#93c5fd;margin-top:8px" onclick="resetLocal()">Reset</button></div></div>
<div id="view-active" class="hidden"><div class="card" style="background:#dcfce7"><h2>🎉 Active!</h2><p><b id="aName"></b> - <span id="aId"></span></p><p>Expires: <span id="aExp"></span></p></div></div>
<script>
const CLOUD='https://script.google.com/macros/s/AKfycbw9NfMJI2qb9yp4rLovSNSwy29RgvytHanl9BA1SfVCwbLq5DV9HsKwodq977bmclp_/exec';
function genId(fn){return `RISE-${(fn.split(' ')[0]||'STUDENT').toUpperCase()}-${Math.floor(1000+Math.random()*9000)}-2026`;}
function saveCurrent(s){localStorage.setItem('rise_current_student',JSON.stringify(s));let l=[];try{l=JSON.parse(localStorage.getItem('rise_students_v2')||'[]')}catch(e){}let i=l.findIndex(x=>x.id===s.id);if(i>=0)l[i]=s;else l.push(s);localStorage.setItem('rise_students_v2',JSON.stringify(l));}
function loadCurrent(){try{return JSON.parse(localStorage.getItem('rise_current_student')||'null')}catch(e){return null}}
async function doJoin(){let name=document.getElementById('name').value.trim(),wa=document.getElementById('wa').value.trim(),txn=document.getElementById('txn').value.trim();if(name.length<3||wa.length<7){document.getElementById('joinMsg').textContent='Enter name & WhatsApp';return}let id=genId(name),st={id,name,whatsapp:wa,txnId:txn,status:'pending',paidAt:new Date().toISOString(),expires:''};saveCurrent(st);try{await fetch(CLOUD,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'add',student:st})})}catch(e){}let txt=`Hi RISE Admin, I joined! Name: ${name} ID: ${id} WhatsApp: ${wa} Txn: ${txn} Please approve.`;window.open(`https://wa.me/5927664692?text=${encodeURIComponent(txt)}`,'_blank');showPending(st);}
function showPending(s){document.getElementById('view-join').classList.add('hidden');document.getElementById('view-active').classList.add('hidden');document.getElementById('view-pending').classList.remove('hidden');document.getElementById('pName').textContent=s.name;document.getElementById('pId').textContent=s.id;document.getElementById('pTxn').textContent=s.txnId;document.getElementById('pStatus').textContent=s.status;document.getElementById('waLink').href=`https://wa.me/5927664692?text=Hi Admin ID ${s.id} pending`;}
function showActive(s){document.getElementById('view-join').classList.add('hidden');document.getElementById('view-pending').classList.add('hidden');document.getElementById('view-active').classList.remove('hidden');document.getElementById('aName').textContent=s.name;document.getElementById('aId').textContent=s.id;document.getElementById('aExp').textContent=s.expires;}
function showJoin(){document.getElementById('view-join').classList.remove('hidden');document.getElementById('view-pending').classList.add('hidden');document.getElementById('view-active').classList.add('hidden');}
function checkStatus(){let cur=loadCurrent();if(!cur)return showJoin();fetch(CLOUD+'?action=list').then(r=>r.json()).then(d=>{let f=d.find(o=>(o.id||o.StudentID||'')===cur.id);if(f){let st=(f.status||f.Status||'pending').toLowerCase();cur.status=st;cur.expires=f.expires||f.ExpiresAt||'';saveCurrent(cur);if(st==='active')showActive(cur);else showPending(cur);}else showPending(cur);}).catch(e=>{let c=loadCurrent();if(c)showPending(c);});}
function resetLocal(){if(confirm('Reset?')){localStorage.removeItem('rise_current_student');showJoin();}}
(function(){let cur=loadCurrent();if(cur){if(cur.status==='active')showActive(cur);else showPending(cur);}})();
</script>
</body>
</html>
